<!doctype html>
<html lang="pt-BR" data-tema="claro">
<head>
<meta charset="utf-8">
<!-- Segurança (CSP): só carrega o que está nesta lista. Explicação e como mudar: seguranca/csp.md -->
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com https://cdn.jsdelivr.net; style-src 'self' https://cdn.jsdelivr.net; img-src 'self' data: blob: https://tiles.openfreemap.org https://www.google.com; font-src 'self'; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com https://www.googleapis.com https://viacep.com.br https://brasilapi.com.br https://open.cnpja.com https://publica.cnpj.ws https://servicodados.ibge.gov.br https://nominatim.openstreetmap.org https://tiles.openfreemap.org https://cdn.jsdelivr.net; worker-src 'self' blob:; child-src blob:; frame-src https://plataforma-sdonline.firebaseapp.com; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seus Serviços — S.D Serviços Digitais</title>
<meta name="robots" content="noindex">
<!-- Padrão do site (mesma ordem em todas as páginas) -->
<link rel="stylesheet" href="../configuracoes/base.css">
<link rel="stylesheet" href="../navbar/navbar.css">
<link rel="stylesheet" href="../rodape/rodape.css">
<!-- Quadro de serviços (componente) + visual desta página -->
<link rel="stylesheet" href="../componentes/kanban-servicos/kanban-servicos.css">
<link rel="stylesheet" href="seus-servicos.css">
<script src="../seguranca/acesso.js" defer></script>
<script src="../configuracoes/config.js" defer></script>
<script src="../navbar/navbar.js" defer></script>
<script src="../rodape/rodape.js" defer></script>
<script src="../componentes/utilidades/utilidades.js" defer></script>
<script src="../componentes/confirmacao/confirmacao.js" defer></script>
<script src="../componentes/kanban-servicos/kanban-servicos.js" defer></script>
<script src="seus-servicos.js" defer></script>
<!-- Firebase (login e banco). Sempre o ÚLTIMO script, com type="module" -->
<script type="module" src="../firebase/firebase.js"></script>
</head>
<body data-pagina="prestador" data-logado="nao" data-tipo="" data-recurso="prestador" data-raiz="../">
<header id="sd-navbar"></header>
<main class="pagina seus-servicos" id="conteudo">

  <!-- ===== CABEÇALHO ===== -->
  <header class="ss-cabecalho">
    <h1>Seus Serviços</h1>
    <p>Contatos, orçamentos e serviços dos seus clientes em um só lugar.</p>
  </header>
  <div class="mensagem" id="msg-geral" role="status" aria-live="polite"></div>
  <!-- Carregando / conta sem quadro (adm) / erro -->
  <p class="ss-estado" id="ss-estado" role="status">Carregando seus serviços…</p>

  <div class="ss-blocos" id="ss-blocos" hidden>
    <!-- ===== BLOCO 1: RESUMO (4 números) ===== -->
    <section class="ss-bloco" aria-labelledby="ss-t-resumo">
      <div class="ss-bloco-topo">
        <h2 id="ss-t-resumo">Resumo</h2>
        <span class="ss-total" id="servicos-total"></span>
      </div>
      <dl class="kanban-resumo" id="kanban-resumo"></dl>
    </section>

    <!-- ===== BLOCO 2: QUADRO (Contatos → Orçado → A realizar → Prestados) ===== -->
    <section class="ss-bloco" aria-labelledby="ss-t-quadro">
      <div class="ss-bloco-topo">
        <h2 id="ss-t-quadro">Quadro</h2>
      </div>
      <p class="ss-dica">Toque em um serviço para ver os detalhes e os botões. Quem fecha e confirma o serviço é o cliente.</p>
      <div class="kanban" id="kanban"></div>
    </section>

    <!-- ===== BLOCO 3: ENCERRADOS (fechado; apagados em 1 ano) ===== -->
    <section class="ss-bloco ss-bloco-encerrados" aria-label="Encerrados">
      <div id="kanban-encerrados"></div>
    </section>
  </div>

  <!-- Avisos do quadro para leitor de tela -->
  <p class="visualmente-oculto" id="kanban-anuncio" aria-live="polite"></p>
</main>
<footer id="sd-rodape"></footer>
</body>
</html>
